<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Glassmorphism Background Gradient -->
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#03050c"/>
    </linearGradient>

    <!-- Glowing Border Accent -->
    <linearGradient id="ftBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Brand Pillar Gradient (Electric Indigo to Vivid Cyan) -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Top Arm Gradient (Vivid Cyan to Emerald Green) -->
    <linearGradient id="topArmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Mid Arm Gradient (Emerald Green Glow) -->
    <linearGradient id="midArmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Lower Right Wealth Growth Bar -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barGradGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Shadow Filter for Standout Clarity -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle with Dual Glow -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#ftBg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#centerGlow)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" stroke="url(#ftBorder)" stroke-width="2"/>

  <!-- Subtle Financial Ledger / Baseline Grid -->
  <line x1="13" y1="50" x2="51" y2="50" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Growth Bar (Cyan) -->
  <rect x="30" y="38" width="6" height="10" rx="3" fill="url(#barGrad)" opacity="0.9"/>

  <!-- Higher Growth Bar (Emerald Green) -->
  <rect x="39" y="31" width="6" height="17" rx="3" fill="url(#barGradGreen)" opacity="0.95"/>

  <!-- Monogram 'F' - Vertical Pillar (Indigo-Cyan) -->
  <rect x="15" y="14" width="8" height="34" rx="4" fill="url(#stemGrad)"/>

  <!-- Monogram 'F' - Mid Branch (Emerald Green) -->
  <rect x="21" y="27" width="14" height="6.5" rx="3.25" fill="url(#midArmGrad)"/>

  <!-- Monogram 'F' - Top Branch (Cyan-to-Emerald) -->
  <rect x="21" y="14" width="22" height="7.5" rx="3.75" fill="url(#topArmGrad)"/>

  <!-- Ascending Growth Trend Arrow (Top Right) -->
  <g filter="url(#softGlow)">
    <path d="M 33 27 L 48 13 M 40 13 L 48 13 L 48 21" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Pulse Sparkle -->
  <circle cx="48" cy="13" r="1.5" fill="#ffffff"/>
</svg>
